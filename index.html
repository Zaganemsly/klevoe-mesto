<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b161d;--pan:#13242d;--pan2:#1a303b;--line:#26404c;--tx:#e9f1f3;--mut:#8ea5af;--acc:#f3b23c;--grn:#4fc386;--red:#e5534b;--blu:#4aa3d8;--g1:#f7d26a;--g2:#b46cff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none;overflow-x:hidden;background:var(--bg);color:var(--tx);font-family:Rubik,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.3}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
select,input{font:inherit}
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
#hdr{position:sticky;top:0;z-index:20;background:#0b161df5;backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
#top{padding:8px 10px 4px}#top .row{flex-wrap:nowrap!important;gap:5px!important}#top .chip{flex:none;font-variant-numeric:tabular-nums}#top .chip:nth-child(2){flex:1 1 auto!important;min-width:60px!important}@media (max-width:520px){.dday{display:none}}
.row{display:flex;align-items:center;gap:8px}
.chip{display:flex;align-items:center;gap:5px;background:var(--pan);border:1px solid var(--line);border-radius:999px;padding:4px 9px;font-weight:500;font-size:13px;white-space:nowrap}
.bar{height:6px;background:#06101a;border-radius:4px;overflow:hidden;flex:1;min-width:40px}

#view{flex:1;padding:10px}

nav#nav .in{gap:4px}
nav#nav button{flex:1;min-width:0;padding:6px 1px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut);background:var(--pan);border:1px solid var(--line);border-radius:10px}
nav#nav button b{font-size:20px;line-height:1}

.scene{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#000}
.scene canvas{display:block;width:100%;height:270px;touch-action:none}
.tag{position:absolute;left:8px;top:8px;background:#0008;border-radius:8px;padding:4px 8px;font-size:12px}
.tag b{font-size:13px}
.panel{background:var(--pan);border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:10px}
.slot{background:var(--pan);border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:10px}
.slot.bite{border-color:var(--acc);box-shadow:0 0 0 2px #f3b23c55}
.slot h4{font-size:14px;display:flex;align-items:center;gap:6px}
.slot .st{margin-left:auto;font-size:12px;color:var(--mut);font-weight:500}
.gear{font-size:12px;color:var(--mut);margin:5px 0 7px}
.btn{background:var(--pan2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-weight:500}
.btn.pri{background:var(--blu);border-color:#6bb8e6;color:#06121a}
.btn.acc{background:var(--acc);border-color:#ffd27a;color:#1d1300;font-weight:700}
.btn.grn{background:var(--grn);border-color:#7fe0ad;color:#04150c;font-weight:700}
.btn.red{background:#4a1f1f;border-color:#7a3434}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{width:100%;padding:13px;font-size:17px}
.hook{animation:pulse .35s infinite alternate}
@keyframes pulse{from{transform:scale(1);box-shadow:0 0 0 0 #f3b23c}to{transform:scale(1.04);box-shadow:0 0 18px 2px #f3b23c}}
.quick{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.quick .btn{flex:1 1 30%;font-size:13px;padding:8px 6px;white-space:nowrap}
input[type=range]{flex:1;accent-color:var(--blu)}
.hint{font-size:12px;margin-top:6px}
.h-good{color:var(--grn)}.h-mid{color:var(--acc)}.h-bad{color:var(--red)}
.fight .tbar{height:20px;border-radius:8px;background:#06101a;overflow:hidden;position:relative;border:1px solid var(--line)}
.fight .tbar{background:linear-gradient(90deg,#1f5a3a 0 60%,#6a5214 60% 85%,#6a1f1f 85%)}
.fight .tbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#4fc386 0,#4fc386 calc(60% * 100 / var(--w,100)),#f3b23c,#e5534b);background:linear-gradient(90deg,#4fc386,#c8d84a 55%,#f3b23c 75%,#e5534b 95%);opacity:.9}
.fight .tbar .needle{position:absolute;top:-4px;bottom:-4px;width:4px;margin-left:-2px;background:#fff;border-radius:2px;box-shadow:0 0 6px #fff}
.fight .tbar.danger{animation:shake .12s infinite}
@keyframes shake{0%{transform:translateX(0)}50%{transform:translateX(2px)}100%{transform:translateX(-2px)}}
.zones{display:flex;font-size:10px;color:var(--mut);margin-top:2px}.zones span:nth-child(1){flex:60}.zones span:nth-child(2){flex:25}.zones span:nth-child(3){flex:15;text-align:right;color:#e5534b}
.reel{position:relative;overflow:hidden}.reel .spool{display:inline-block;font-size:24px;line-height:1;vertical-align:middle;margin-right:6px}.reel .rpw{position:absolute;left:0;bottom:0;height:5px;background:#fff;opacity:.7;width:0}
.echo{display:block;width:100%;height:96px;border-radius:12px;margin-top:8px;border:1px solid #1e4a66;background:#020a14}
.echo-lock{display:block;width:100%;margin-top:8px;padding:9px;border-radius:12px;border:1px dashed var(--line);background:var(--pan);font-size:12px;color:var(--mut);text-align:left}.echo-lock b{color:var(--acc)}
.fight .tbar .dm{position:absolute;top:-2px;bottom:-2px;width:3px;background:#fff;opacity:.8}
.fight .info{display:flex;justify-content:space-between;font-size:13px;margin:6px 0}
.reel{width:100%;padding:22px;font-size:20px;font-weight:800;border-radius:16px;background:linear-gradient(#3a8fc4,#256c99);border:1px solid #6bb8e6;user-select:none;-webkit-user-select:none;touch-action:none}
.reel.on{background:linear-gradient(#f3b23c,#c98a1a);border-color:#ffd27a;color:#1d1300}
.msg{font-size:13px;min-height:18px;text-align:center;margin:6px 0;color:var(--acc)}
h2{font-size:18px;margin:4px 0 10px}
h3{font-size:15px;margin:14px 0 8px;color:var(--mut);font-weight:500}
.lb{display:flex;flex-direction:column;gap:4px}.lbr{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:#0f2230}.lbr.me{background:linear-gradient(90deg,#3a2a0a,#1b2a3a);border:1px solid var(--acc)}.lbp{width:30px;font-weight:800}.lbn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reflink{background:#0a1820;border:1px dashed var(--line);border-radius:10px;padding:10px;font-size:13px;word-break:break-all;text-align:center}
.stat{flex:1;background:#0f2230;border-radius:10px;padding:8px;text-align:center}.stat b{display:block;font-size:17px}.stat span{font-size:11px;color:var(--mut)}
.sl{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}.slh,.slr{display:grid;grid-template-columns:30px 1fr 1fr;gap:6px;align-items:stretch}.slh{font-size:12px;color:var(--mut);padding:0 4px}
.slr{opacity:.6}.slr.ok{opacity:1}.sln{display:grid;place-items:center;font-weight:800;background:#0f2230;border-radius:8px}
.slc{background:var(--pan);border:1px solid var(--line);border-radius:10px;padding:7px;font-size:11.5px;line-height:1.35;display:flex;flex-direction:column;gap:5px;justify-content:space-between}.slc.pr{background:linear-gradient(135deg,#2a1d06,#24123a);border-color:#a3843a}.slc.lk{filter:grayscale(.5)}.slc em{font-style:normal;color:var(--grn);font-weight:800}.slc .btn{padding:5px;font-size:12px}
.starter{background:linear-gradient(135deg,#3a2306,#2a1250);border:1.5px solid var(--g1)}.badge2{background:var(--grn);color:#062;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:800}
.evtabs{display:grid!important;grid-template-columns:repeat(4,1fr);gap:5px!important;margin-top:2px}.evtabs button{padding:8px 2px!important;font-size:12.5px!important;text-align:center}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.tabs button{padding:7px 11px;border-radius:999px;background:var(--pan);border:1px solid var(--line);white-space:nowrap;font-size:13px}
.tabs button.on{background:var(--acc);color:#1d1300;border-color:var(--acc);font-weight:700}
.tabs button.lim{background:linear-gradient(90deg,#3a2a0a,#2a1440);border-color:#a3843a}
.tabs button.lim.on{background:linear-gradient(90deg,var(--g1),var(--g2));color:#140a20}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--pan);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;position:relative}
.card .ic{height:64px;display:flex;align-items:center;justify-content:center;font-size:40px;background:#0a1820;border-radius:10px}
.card .ic svg{height:60px;width:100%}
.card .nm{font-weight:700;font-size:13px}
.card .ds{font-size:12px;color:var(--mut)}
.card .pr{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:6px}

.card.own{border-color:#2e6b4a}
.card.lock{opacity:.6}
.lim{position:relative}
.card.lim{border:1px solid transparent;background:linear-gradient(var(--pan),var(--pan)) padding-box,conic-gradient(from var(--a,0deg),var(--g1),var(--g2),#4ad0ff,var(--g1)) border-box;animation:spin 4s linear infinite}

.badge{position:absolute;top:8px;right:8px;font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;background:linear-gradient(90deg,var(--g1),var(--g2));color:#1a0a28;letter-spacing:.5px}
.timer{background:linear-gradient(90deg,#2a1a08,#1e0e30);border:1px solid #6a5426;border-radius:12px;padding:10px;margin-bottom:10px;font-size:13px}
.timer b{color:var(--g1)}
.base{background:var(--pan);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.base .hd{padding:10px 12px;display:flex;align-items:center;gap:11px}
.base .hd .t{flex:1}
.bico{flex:none;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--bc) 100%,#fff 35%),var(--bc) 55%,color-mix(in srgb,var(--bc) 70%,#000));border:1.5px solid rgba(255,214,120,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 3px 8px rgba(0,0,0,.35)}
.bico svg{width:31px;height:31px;fill:none;stroke:#fff8e6;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.bico.lk{filter:grayscale(.55) brightness(.85);border-color:rgba(255,255,255,.15)}
.base .hd .t b{display:block;font-size:15px}
.base .hd .t span{font-size:12px;color:var(--mut)}
.locs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 8px 8px}
.loc{border-radius:10px;overflow:hidden;position:relative;border:1px solid var(--line);text-align:left}
.loc img{display:block;width:100%;height:78px;object-fit:cover}
.loc span{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 4px;font-size:12px;font-weight:500;background:linear-gradient(transparent,#000c)}
.loc.here{border-color:var(--acc);box-shadow:0 0 0 2px #f3b23c66}
.loc i{position:absolute;top:4px;right:4px;font-style:normal;font-size:10px;background:#000a;padding:1px 5px;border-radius:5px}
.list .it{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.list .it svg{width:64px;height:32px;flex:none}
.list .it .n{flex:1;font-size:13px}
.list .it .n small{display:block;color:var(--mut);font-size:11px}
.atlas{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.atlas .a{background:var(--pan);border:1px solid var(--line);border-radius:10px;padding:6px;text-align:center;font-size:11px}
.atlas .a svg,.atlas .a img{width:100%;height:44px;object-fit:contain;display:block}
.list .it img{width:64px;height:32px;object-fit:contain;flex:none}
#modal .box img.big{width:100%;height:150px;object-fit:contain}
.atlas .a b{display:block;font-size:12px}
.atlas .a.rb{border-color:#6a3030}
select{width:100%;background:var(--pan2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px}
label.f{display:block;font-size:12px;color:var(--mut);margin:7px 0 3px}
#modal{position:fixed;inset:0;background:#000b;z-index:50;display:none;align-items:center;justify-content:center;padding:14px}
#modal.on{display:flex}
#modal .box{background:var(--pan);border:1px solid var(--line);border-radius:16px;padding:14px;max-width:420px;width:100%;max-height:88vh;overflow:auto}
#modal .box svg.big{width:100%;height:150px}
#toast{position:fixed;top:120px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:92%;max-width:420px}
#toast div{background:#102028f5;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
.trophy{display:inline-block;background:var(--acc);color:#1d1300;font-weight:800;border-radius:6px;padding:1px 6px;font-size:11px}
.redbook{display:inline-block;background:#a33;color:#fff;font-weight:700;border-radius:6px;padding:1px 6px;font-size:11px}
.mut{color:var(--mut)}
.sm{font-size:12px}
.sep{height:1px;background:var(--line);margin:10px 0}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tcard{--tc:#f3b23c;border-radius:12px;padding:2px;background:linear-gradient(135deg,var(--tc),#1a303b 40%,#1a303b 60%,var(--tc));cursor:pointer;position:relative;overflow:hidden;text-align:center}
.tcard .tc-in{background:radial-gradient(circle at 50% 35%,#1f3a48,#0b161d 75%);border-radius:10px;padding:6px 5px 5px;height:100%}
.tcard .tc-top{display:flex;justify-content:space-between;font-size:8px;font-weight:800;letter-spacing:.5px;color:var(--tc)}
.tcard .tc-pic svg,.tcard .tc-pic img{width:100%;height:46px;object-fit:contain;display:block}
.tcard .tc-name{font-size:11px;font-weight:700;line-height:1.1}
.tcard .tc-w{font-size:14px;font-weight:800;color:var(--tc)}
.tcard .tc-id{font-size:7px;color:var(--mut);letter-spacing:.5px;margin-top:2px;font-family:monospace}
.tcard .tc-meta{font-size:12px;color:var(--mut);margin:8px 0 4px;line-height:1.5}
.tcard.big{max-width:300px;margin:0 auto;cursor:default}
.tcard.big .tc-in{padding:12px}
.tcard.big .tc-top{font-size:12px}
.tcard.big .tc-pic svg,.tcard.big .tc-pic img{height:130px}
.tcard.big .tc-name{font-size:18px}
.tcard.big .tc-w{font-size:28px}
.tcard.big .tc-id{font-size:11px}
.t-trophy{--tc:#f3b23c}.t-rare{--tc:#b46cff}
.t-legend{--tc:#ff4fd8;background:conic-gradient(from var(--a,0deg),#ff4fd8,#ffd84a,#4ad0ff,#7aff8a,#ff4fd8);animation:spin 3s linear infinite}
.t-rare::after,.t-legend::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.22) 45%,transparent 60%);background-size:250% 100%;animation:holo 3.2s linear infinite;pointer-events:none;border-radius:12px}
@keyframes holo{from{background-position:150% 0}to{background-position:-100% 0}}

.fanim.jump svg,.fanim.jump img{animation:jmp calc(var(--d)*1.6) cubic-bezier(.3,.6,.4,1) infinite}
@keyframes flop{0%,100%{transform:rotate(calc(var(--a)*-1)) translateY(0)}50%{transform:rotate(var(--a)) translateY(-6px)}}
@keyframes wig{0%,100%{transform:skewY(-3deg) scaleX(1)}50%{transform:skewY(3deg) scaleX(.96)}}

.fanim.tro svg,.fanim.tro img{filter:drop-shadow(0 0 10px var(--tc,#f3b23c)) drop-shadow(0 0 22px var(--tc,#f3b23c))}
.fanim.ft-trophy{--tc:#f3b23c}.fanim.ft-rare{--tc:#b46cff}.fanim.ft-legend{--tc:#ff4fd8}
.fight.tro{border-color:var(--acc);animation:trog 1.2s ease-in-out infinite}
@keyframes trog{0%,100%{box-shadow:0 0 0 0 #f3b23c00}50%{box-shadow:0 0 18px 2px #f3b23c88}}
.trophy.pulse{animation:pulse .5s infinite alternate}
.tourban{display:none;margin-top:8px;padding:8px 10px;border-radius:12px;background:linear-gradient(90deg,#3a2a08,#1b303b);border:1px solid #8a6a2a;font-size:12px}
.thr{display:flex;gap:6px;margin:8px 0}
.nopay .btn.stars,.nopay .paidonly{display:none!important}
.nybox{background:linear-gradient(160deg,#1a3a5a,#0f2232 60%,#3a1a2a);border-color:#6aa8d8;position:relative;overflow:hidden}
.nybox::before{content:'❄ ❅ ❆ ❄ ❅ ❆ ❄';position:absolute;top:4px;right:8px;opacity:.25;font-size:14px;letter-spacing:6px}
.tcard.nyc{background:linear-gradient(135deg,#bfe6ff,#ffffff 30%,#7ab8e8 60%,#ffffff 85%,#bfe6ff)}
.tcard.nyc .tc-in{background:radial-gradient(circle at 50% 35%,#24486a,#0b1a2a 75%)}
.tcard.nyc .tc-top span:first-child::before{content:'❄ '}
.btn.stars{background:linear-gradient(90deg,#ffd84a,#ffae2a);border-color:#ffe08a;color:#2a1a00;font-weight:800}

.wheelbox{background:radial-gradient(circle at 50% 30%,#2a1d40,#14242d 70%)}.wheelwrap{position:relative;width:300px;max-width:100%;margin:6px auto 10px}.wheel{width:100%;display:block;filter:drop-shadow(0 6px 18px #0008)}.pointer{position:absolute;left:50%;top:-14px;transform:translateX(-50%);z-index:2;line-height:0;filter:drop-shadow(0 3px 3px #0009)}

<body>
<div id="app">
  <header id="hdr"><div id="top"></div>
<nav id="nav"><div class="in">
  <button data-a="nav" data-v="fish"><b>🎣</b>Рыбалка</button>
  <button data-a="nav" data-v="map"><b>🗺️</b>Карта</button>
  <button data-a="nav" data-v="shop"><b>🛒</b>Магазин</button>
  <button data-a="nav" data-v="tackle"><b>🧰</b>Снасти</button>

function actF(a,h){const night=h>=21||h<5,day=h>=8&&h<19,dawn=(h>=4&&h<9)||(h>=18&&h<22);if(a==='day')return day?1.4:night?.35:.9;if(a==='night')return night?1.5:day?.5:1;if(a==='dawn')return dawn?1.6:.7;return 1}
/* рельеф дна: xf — поперёк (0..1), df — дальность (0 у берега .. 1 = 80 м) */
const DCACHE={};
function bottomFeat(loc){if(DCACHE[loc.id])return DCACHE[loc.id];const R=seeded(hash(loc.id)+99);const f=[];for(let i=0;i<6;i++)f.push({x:R(),d:.15+R()*.85,r:.07+R()*.14,a:(R()-.45)*.75});return DCACHE[loc.id]=f}
function depthAt(loc,xf,df){const D=loc.d,q=clamp(df,0,1);let base;
 if(loc.pr==='offshore')base=.6+.4*Math.min(1,q/.35);
 else if(loc.pr==='pond')base=.2+.8*Math.pow(Math.sin(Math.PI*Math.min(.98,q*.92+.04)),.7);
 else if(loc.pr==='river')base=q<.78?.15+.85*Math.pow(q/.78,1.1):1-.75*Math.pow((q-.78)/.22,2);
 else base=.15+.85*Math.min(1,Math.pow(q/.7,.8));
 let v=D*base;for(const b of bottomFeat(loc)){v+=b.a*D*Math.exp(-((xf-b.x)**2+(q-b.d)**2)/(b.r*b.r))}v+=Math.sin(xf*9+q*5+hash(loc.id)%7)*D*.05;return Math.round(clamp(v,.3,D)*10)/10}
function marks(loc){const key=loc.id+'|'+S.day+'|'+Math.floor(S.time/90);if(marks.k===key)return marks.v;const R=seeded(hash(key));const m=[];const n=5+Math.floor(R()*5);for(let i=0;i<n;i++){const xf=.08+R()*.84,df=.12+R()*.86,bd=depthAt(loc,xf,df);m.push({xf,df,dep:bd*(.45+R()*.5),big:R()<.25})}marks.k=key;marks.v=m;return m}
function nearMark(loc,xf,df){return marks(loc).some(m=>Math.hypot(m.xf-xf,(m.df-df)*1.3)<.09)}

function effDepth(i){const s=S.slots[i],r=RT[i],rod=ITEM[s.rod];const b=(r.st!=='idle'&&r.bottom!=null)?r.bottom:null;if(b==null)return isBottomRod(rod)?null:s.depth;return isBottomRod(rod)?b:Math.min(s.depth,b)}

}

function fightStep(dt){
 const F=FIGHT;if(!F)return;const s=S.slots[F.i],rod=ITEM[s.rod],reel=ITEM[s.reel],line=ITEM[s.line],f=F.f,W=F.w<20?F.w:20*Math.pow(F.w/20,.75+.25*clamp(Math.log10(F.w/20)/Math.log10(250),0,1)),pow=f.pow||1,endur=F.w>100?1+Math.log10(F.w/100)*3.5:1;
 F.t+=dt;const st=F.st;
 /* плавный ход: сила подмотки нарастает и спадает постепенно */
 F.rp+=((reeling?1:0)-F.rp)*Math.min(1,dt*(reeling?2.2:4));const rp=F.rp;
 F.ang+=rp*dt*900*reel.spd;
 let pull=W*(.25+.75*st)*pow*(.75+.35*Math.sin(F.t*1.6+F.ph)+.25*Math.sin(F.t*4.1+F.ph2));
 if(Math.random()<dt*.22*st){F.surge=.9;F.msg='Рыба рванула!'}
 F.sg+=((F.surge>0?1:0)-F.sg)*Math.min(1,dt*6);if(F.surge>0)F.surge-=dt;
 pull*=1+(F.w>1000?1.2:F.w>200?.9:.7)*F.sg;pull=Math.max(pull,W*.08+.02);
 const target=pull*(.55+.5*rp)+.12*rp;
 const drag=reel.drag*F.drag;let pay=0;
 F.ten+=(target-F.ten)*Math.min(1,dt*4.5);
 let ten=F.ten;if(ten>drag){pay=Math.max(ten,target)-drag;ten=drag+pay*.12;F.ten=ten}
 const hungry=S.sat<=0?.7:1;
 if(pay>0)F.dist+=Math.min(6,pay/Math.max(W*.3,.2))*dt*2.2;
 else F.dist-=reel.spd*1.7*hungry*dt*rp*Math.max(.2,1-pull/(drag*1.3+.01));
 if(rp<.3)F.dist+=.4*st*dt*(W>.5?1:.3)*(1-rp);
 F.st=Math.max(0,F.st-dt*(fxOn('power')?1.5:1)*(ten/(W*pow+.3))*.1*(.45+.55*rp)*(pay>0?1.6:1)/endur);
 if(rp<.2)F.st=Math.min(1,F.st+dt*.015);
 F.pay=pay;
 const limit=Math.min(line.str,rod.load*1.2)*(fxOn('power')?1.3:1);F.limit=limit;
 if(ten>limit){F.over+=dt;if(F.over>.25)return endFight('snap')}else F.over=Math.max(0,F.over-dt);
 if(F.dist>(reel.cap||150))return endFight('spool');
 if(F.ja>0){F.ja+=dt/(F.jk==='roll'?1.1:.8);if(F.ja>=1){F.ja=0;F.jt=2.5+Math.random()*4*(1.3-F.st)}}else{F.jt-=dt;if(F.jt<=0&&F.st>.12){F.ja=.001;F.jk=jumpKind(f)}}
 if(rp<.2&&ten<limit*.08&&F.st>.15&&W>.15){F.slack+=dt;if(F.slack>4&&Math.random()<dt*.6)return endFight('escape')}else F.slack=0;
 if(F.dist<=.8)return endFight('catch');
 const r=ten/limit;
 if(r>.85)F.msg='🔴 Красная зона — отпусти катушку!';
 else if(F.st<.12)F.msg='Рыба устала — подматывай!';
 else if(ten>rod.load*.9)F.msg='⚠️ Удилище трещит!';
 else if(pay>0)F.msg='Фрикцион трещит — рыба тянет леску';
 else if(F.slack>2)F.msg='Леска провисла — рыба может сойти!';
 else if(F.sg<.1&&F.t>1.5)F.msg=r>.6?'Тяжело идёт — держи в жёлтой зоне':'Подматывай ровно';
}
function updateFightUI(){

 const tb=$('#tbar');if(!tb)return;
 tb.style.width=Math.min(100,r*100)+'%';$('#tneedle').style.left=Math.min(100,r*100)+'%';
 $('#tbarw').classList.toggle('danger',r>.85);
 const reel=ITEM[s.reel];$('#dmark').style.left=Math.min(100,reel.drag*F.drag/F.limit*100)+'%';

 if(STARS_API){if(!TG)return toast('Покупки работают внутри Telegram');
  fetch(STARS_API+'/api/invoice',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:TG.initData,product})}).then(r=>r.json()).then(j=>{if(!j.link)return toast(j.error||'Не удалось создать счёт');
   TG.openInvoice(j.link,st=>{if(st==='paid'){toast('⭐ Оплата прошла — выдаём покупку…');claimPurchases(0)}else if(st==='failed')toast('Оплата не прошла');else toast('Оплата отменена')})}).catch(()=>toast('Нет связи с сервером, попробуйте позже'));return}
 window._grant=grant;modal(`<h2>${title}</h2><div style="font-size:28px;font-weight:800;color:#ffd84a;margin:6px 0">${stars} ⭐</div><div class="sm mut">Сервер оплаты не подключён — тестовый режим.</div>

  else if(id==='ref'){S.money+=300000;addPot('giant',1);S.spinTok=(S.spinTok||0)+1;modal(`<div style="text-align:center"><div style="font-size:56px">🎉</div><h2>${esc(r.name||'Друг')} дошёл до 5 уровня!</h2><div>💰 300 000 ₽ · 🍶 Отвар великана · 🔮 вращение Колеса</div><button class="btn acc" style="width:100%;margin-top:14px" data-a="close">Забрать</button></div>`)}
  else if(id==='top'){S.money+=r.m||0;S.passes=(S.passes||0)+(r.passes||0);S.spinTok=(S.spinTok||0)+(r.spins||0);if(r.pot)for(const k in POTIONS)addPot(k,r.pot);modal(`<div style="text-align:center"><div style="font-size:56px">${['🥇','🥈','🥉'][r.place-1]||'🏆'}</div><h2>${r.place} место в рейтинге недели!</h2><div>💰 ${money(r.m||0)}${r.passes?` · 🎫×${r.passes}`:''}${r.spins?` · 🔮×${r.spins}`:''}${r.pot?` · 🧪 по ${r.pot} каждого`:''}</div><button class="btn acc" style="width:100%;margin-top:14px" data-a="close">Забрать</button></div>`)}}
 else if(kind==='cash'){const c=CASH.find(x=>x.id===id);if(c){S.money+=c.m;toast(`💰 +${money(c.m)} на счёт`)}}
 else if(kind==='base'){const b=BASE[id];S.unl=S.unl||{};S.unl[id]=true;toast(`🎫 ${b?b.n:id} — открыт навсегда!`)}
 else if(kind==='wheel'){view='tour';wheelMode='paid';render();setTimeout(()=>spin('paid',p.result&&p.result.idx),300)}

 save();renderTop()}

  if(!Q.bonus&&Q.list.every(x=>x.claimed)){Q.bonus=true;addPot('giant',1);setTimeout(()=>toast('🏅 Все задания дня! Бонус: 🍶 Отвар великана'),700)}save();render()},
 tourJoin(v){const T=TOUR[v];if(!T||S.tour)return;if(S.lvl<T.lvl)return;if(S.base!==T.base)return toast(`Турнир проходит на водоёме «${BASE[T.base].n}» — сначала поезжай туда (Карта)`);if(S.money<T.fee)return toast('Не хватает на взнос');S.money-=T.fee;tourStart(T);toast(`🏆 Турнир «${T.n}» начался! ${tourKind(T)}`);save();view='fish';render()},

 forage(){if(FIGHT)return;if(S.berryDay===S.day)return modal(`<h2>🌿 Ягоды</h2><div class="sm">Не буду больше ягоды есть — сегодня уже наелся. Нужна нормальная еда: загляни в магазин → «Продукты».<br><br>Если денег нет — поймай пару рыб и продай их, или подожди до завтра на ускорении ⏩ ×20.</div><button class="btn" style="width:100%;margin-top:12px" data-a="close">Понятно</button>`);S.berryDay=S.day;S.time+=30;const g=8+Math.round(Math.random()*8);S.sat=Math.min(100,S.sat+g);toast(`🌿 Полчаса собирал ягоды и грибы: сытость +${g}`);renderTop();save()},
 dig(){if(FIGHT)return;if(S.digDay!==S.day){S.digDay=S.day;S.digN=0}if(S.digN>=3)return toast('🪱 Сегодня тут всё перекопано — червей больше нет. Завтра снова');S.digN++;S.time+=20;const n=4+Math.floor(Math.random()*5);S.baits.worm=(S.baits.worm||0)+n;toast(`🪱 Накопал червей: +${n} (20 минут)`);if(view==='fish')renderPanel();save()},
 keep(){const p=S._pending;if(!p)return;S.net.push({id:p.id,w:p.w,v:p.v,tr:p.tr,tier:p.tier});addXP(p.xp);S._pending=null;closeModal();setTimeout(nextHooked,400);toast(`🐟 ${FISH[p.id].n} ${kg(p.w)} — в садке`);save();renderTop()},
 release(){const p=S._pending;if(!p)return;qProg('release',1);const f=FISH[p.id];addXP(p.xp*(f.rb?2:1.3));S._pending=null;closeModal();setTimeout(nextHooked,400);toast(`💧 ${f.n} отпущен(а). Спасибо за бережную рыбалку!`);save();renderTop()},
 relNet(v){S.net.splice(+v,1);render();save()},
 sell(){const tot=S.net.reduce((a,f)=>a+f.v,0);qProg('sell',tot);S.money+=tot;S.net=[];toast(`💰 Улов продан за <b>${money(tot)}</b>`);save();render()},
 travel(v){const b=BASE[v];if(!baseOpen(b))return;if(S.money<b.cost&&!(S.passes>0))return needMoney(b.cost);
  modal(`<h2>Поездка: ${b.n}</h2><div class="sm">Дорога стоит <b>${money(b.cost)}</b> и займёт 3 часа игрового времени.${S.net.length?`<br>Улов из садка (${money(S.net.reduce((a,f)=>a+f.v,0))}) будет продан перед отъездом.`:''}</div><div class="row" style="margin-top:12px"><button class="btn" style="flex:1" data-a="close">Отмена</button><button class="btn pri" style="flex:1" data-a="travelGo" data-v="${v}">Поехать</button></div>${(S.passes||0)>0?`<button class="btn acc" style="width:100%;margin-top:8px" data-a="travelGo" data-v="${v}|pass">🎫 Поехать по путёвке (бесплатно, осталось ${S.passes})</button>`:''}`)},
 travelGo(v){let pass=false;if(v.endsWith('|pass')){v=v.split('|')[0];pass=S.passes>0}const b=BASE[v];if(!pass&&S.money<b.cost)return;if(S.net.length){const t=S.net.reduce((a,f)=>a+f.v,0);S.money+=t;S.net=[];toast(`💰 Улов продан за ${money(t)}`)}
  if(S.tour){S.tour=null;toast('🏆 Турнир покинут')}if(pass){S.passes--;toast('🎫 Путёвка использована')}else S.money-=b.cost;S.base=v;S.loc=b.locs[0].id;S.time+=180;resetRods();closeModal();toast(`🚗 Вы прибыли: <b>${b.n}</b>`);if(v==='ny')setTimeout(()=>toast('🎄 С Новым годом! Сверли лунки — рыба ждёт'),800);view='fish';save();render()},
 goloc(v){const l=LOC[v];if(l.base!==S.base)return toast('Сначала доберись до этого водоёма — кнопка «Поехать»');S.loc=v;resetRods();S.time+=20;view='fish';save();render()},
 shopTab(v){shopTab=v;render()},
 buy(v){const [cat,id]=v.split('|');let it=ITEM[id]||(BAITS[id]&&Object.assign({id},BAITS[id]))||(FOOD[id]&&Object.assign({id},FOOD[id]));if(!it)return;
  if(S.lvl<(it.lvl||1))return;if(S.money<it.p)return needMoney(it.p);
  if(cat==='lim'&&!limNow().some(x=>x.id===id))return toast('Эта вещь сейчас не в продаже');
  if(FOOD[id]){S.food[id]=(S.food[id]||0)+1}
  else if(BAITS[id]){S.baits[id]=(S.baits[id]||0)+BAITS[id].q}
  else{if(owns(id))return;S.own.push(id)}
  S.money-=it.p;toast(`🛒 Куплено: ${it.n}`);save();render()},
 eatMenu(){const list=Object.entries(FOOD).filter(([id])=>S.food[id]>0);
  modal(`<h2>Перекус</h2><div class="sm mut">Сытость: ${Math.round(S.sat)}%. Голодный рыбак не может забрасывать снасть.</div><div class="list">${list.length?list.map(([id,f])=>`<div class="it"><span style="font-size:26px">${f.e}</span><div class="n">${f.n}<small>+${f.sat} сытости · есть ${S.food[id]}</small></div><button class="btn grn" data-a="eat" data-v="${id}">Съесть</button></div>`).join(''):'<div class="sm" style="padding:10px 0">В рюкзаке пусто — загляни в магазин, раздел «Продукты».</div>'}</div><button class="btn" style="width:100%;margin-top:10px" data-a="close">Закрыть</button>`)},
 eat(v){if(!(S.food[v]>0))return;S.food[v]--;S.sat=Math.min(100,S.sat+FOOD[v].sat);toast(`${FOOD[v].e} Вкусно! Сытость ${Math.round(S.sat)}%`);save();renderTop();ACT.eatMenu()},
 speed(){S.speed=S.speed===1?5:S.speed===5?20:1;render()},
 locFish(){const loc=curLoc();modal(`<h2>${loc.n}</h2><div class="sm mut">Здесь водится:</div><div class="list">${loc.fish.map(([id])=>{const f=FISH[id],r=S.rec[id];return `<div class="it" ${r?`data-a="fishInfo" data-v="${id}"`:''}>${fishPic(f,!r)}<div class="n">${r?f.n:'??? неизвестная рыба'}<small>${r?'Берёт на: '+f.b.map(b=>BAITS[b].e).join(' ')+' · '+f.d[0]+'–'+f.d[1]+' м':'Поймай, чтобы узнать'}</small></div></div>`}).join('')}</div><button class="btn" style="width:100%;margin-top:10px" data-a="close">Закрыть</button>`)},
 fishInfo(v){modal(fishInfoHTML(FISH[v]))},
 cardView(v){const c=(S.cards||[]).find(x=>x.uid===v);if(!c)return;modal(`<div style="text-align:center">${cardHTML(c,true)}</div><button class="btn stars" style="width:100%;margin-top:12px" data-a="shareCard" data-v="${c.uid}">📣 Похвастаться</button><button class="btn pri" style="width:100%;margin-top:8px" data-a="cardCopy" data-v="${c.uid}">Скопировать метаданные NFT (TON, TEP-64)</button><pre id="nftjson" style="display:none;white-space:pre-wrap;font-size:11px;background:#0a1820;border-radius:8px;padding:8px;margin-top:8px;max-height:180px;overflow:auto"></pre><button class="btn" style="width:100%;margin-top:8px" data-a="close">Закрыть</button>`)},
 cardCopy(v){const c=(S.cards||[]).find(x=>x.uid===v);if(!c)return;const j=JSON.stringify(nftMeta(c),null,2);const pre=$('#nftjson');pre.textContent=j;pre.style.display='block';try{navigator.clipboard.writeText(j).then(()=>toast('📋 Метаданные скопированы'),()=>toast('Скопируй текст вручную'))}catch(e){toast('Скопируй текст вручную')}},
 help(){S.seenHelp=true;save();modal(`<h2>Как ловить</h2><div class="sm" style="line-height:1.5">
 1. Нажми <b>«🎯 Забросить»</b> и коснись воды — куда ткнёшь, туда и полетит (в пределах дальности удилища). Можно просто ткнуть в воду — заброс сделает свободная снасть.<br>2. Когда поплавок нырнёт или зазвенит колокольчик — жми <b>«ПОДСЕЧЬ!»</b>, пока не поздно.<br>3. Держи <b>«КРУТИТЬ»</b> (или пробел), следи за натяжением. Если шкала краснеет — отпусти кнопку, дай рыбе устать.<br>4. <b>Фрикцион</b> — главный друг: поставь его ниже прочности лески, тогда рыба будет стравливать леску, а не рвать её.<br>5. Глубина и наживка решают всё. Загляни в «📖 Рыба водоёма» — пойманные виды показывают, на что берут.<br>6. У каждой точки своя глубина. Глубомер и эхолот (магазин → «Снаряжение») показывают дно, а эхолот ещё и стаи рыбы.<br>7. Голодным ловить можно, но хуже. Нет денег — ягоды 🌿 (раз в день) и черви 🪱 (3 раза в день) выручат: поймай пару рыб и купи еду.<br>8. Клюнуло на другой удочке, пока вываживаешь? Жми «Подсечь» — рыба подождёт на крючке.<br>9. Рыбу из Красной книги можно только отпустить — зато опыта вдвое больше. Турниры — во вкладке 🏆.</div>
 <div class="row" style="margin-top:12px"><button class="btn pri" style="flex:1" data-a="close">Понятно!</button><button class="btn red" data-a="resetAsk">Сброс</button></div>
 ${RELEASE?'':'<button class="btn" style="width:100%;margin-top:8px;border-style:dashed" data-a="devBoost">🧪 Тест: 50 уровень + 100 млн ₽</button>'}`)},
 /* ТЕСТОВАЯ КНОПКА — убрать перед релизом */
 devBoost(){if(RELEASE)return;S.lvl=Math.max(S.lvl,50);S.xp=0;S.money+=100000000;S.sat=100;closeModal();toast('🧪 Тест: уровень 50, +100 000 000 ₽');save();render()},
 resetAsk(){modal(`<h2>Сбросить прогресс?</h2><div class="sm">Деньги, снасти, рекорды и уровень будут удалены.</div><div class="row" style="margin-top:12px"><button class="btn" style="flex:1" data-a="close">Отмена</button><button class="btn red" style="flex:1" data-a="resetGo">Сбросить</button></div>`)},
 resetGo(){S=DEF();resetRods();save();closeModal();view='fish';render()},

 if(t.dataset.in==='drag'&&FIGHT){FIGHT.drag=+t.value;S.dragPct=+t.value;$('#dragv').textContent=(ITEM[S.slots[FIGHT.i].reel].drag*FIGHT.drag).toFixed(1)+' кг'}});
